<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Gen By David — Direction board</title>
<style>
/* =========================================================
   VOICE GEN — redesign exploration. 1 DOM, 3 directions.
   A: PAPER STUDIO   (editorial, light, serif headline)
   B: NIGHT CONSOLE  (dense dark tool, mono accents)
   C: GALLERY        (soft pop tiles, pastel persona fields)
   ========================================================= */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+Display:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit}
:root{--sans:'Inter','Noto Sans Myanmar',system-ui,sans-serif;--mm:'Noto Sans Myanmar',sans-serif}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
svg{display:inline-block;vertical-align:middle;flex-shrink:0}

/* ---------- board chrome ---------- */
.board{min-height:100vh;background:#191a1c;color:#e8e9ea;display:flex;flex-direction:column}
.board-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;background:#111214;border-bottom:1px solid #2a2c2f;font-size:13px}
.board-bar b{font-weight:700;letter-spacing:.2px}
.board-bar small{color:#8a8f94}
.dir{display:flex;gap:6px;flex-wrap:wrap}
.dir button{padding:8px 13px;min-height:38px;border-radius:9px;border:1px solid #33363a;color:#9aa0a6;font-size:12px;font-weight:600}
.dir button.on{background:#e8e9ea;color:#111214;border-color:#e8e9ea}
.loc{margin-left:auto;display:flex;border:1px solid #33363a;border-radius:9px;overflow:hidden}
.loc button{padding:8px 11px;min-height:38px;font-size:12px;font-weight:700;color:#9aa0a6}
.loc button.on{background:#2e3134;color:#fff}
.stage{flex:1;display:flex;flex-direction:column}
.note{padding:9px 16px;font-size:11px;color:#7b8187;border-bottom:1px solid #2a2c2f}
.note b{color:#aab0b6;font-weight:600}

/* ---------- shared content structure ---------- */
.app{flex:1;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700}
.brand i{display:grid;place-items:center;width:30px;height:30px;font-style:normal}
.nav{display:none;gap:2px;margin-left:14px}
.nav a{padding:8px 11px;font-size:12px;border-radius:8px;text-decoration:none}
.top .sp{flex:1}
.pill-btn{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:10px;font-size:12px;font-weight:600}
.hero{padding:26px 18px 8px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%}
.hero h1{margin:12px 0 6px;font-size:clamp(26px,4.6vw,40px);line-height:1.25;letter-spacing:-.02em;max-width:22ch;text-wrap:balance}
.hero p{max-width:56ch;line-height:1.75;font-size:13.5px}
.search{display:flex;align-items:center;gap:10px;margin-top:18px;max-width:640px}
.search svg{flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;padding:10px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:16px 18px 0}
.filters button{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.sec{display:flex;align-items:end;justify-content:space-between;gap:12px;padding:22px 18px 12px;flex-wrap:wrap}
.sec h2{font-size:clamp(19px,3vw,26px);line-height:1.3}
.sec p{font-size:12.5px;margin-top:4px}
.count{font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;white-space:nowrap}
.cmp-open{display:flex;align-items:center;gap:9px;margin:0 18px 14px;padding:12px 14px;font-size:13px;font-weight:600;text-align:left}
.cmp-open svg:last-child{margin-left:auto}
.vlist{list-style:none;display:grid;padding:0 18px}
.v{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto auto;align-items:center;gap:14px}
.v__idx{font-weight:600}
.v__ava{position:relative;display:grid;place-items:center;border-radius:50%;font-weight:800;flex-shrink:0}
.v__ava .ply{position:absolute;inset:0;display:grid;place-items:center;opacity:0;border-radius:50%;transition:opacity .15s}
.v__ava:hover .ply,.v__ava:focus-visible .ply{opacity:1}
.v__meta{min-width:0}
.v__name{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px}
.v__name svg{width:15px;height:15px}
.v__desc{font-size:12.5px;line-height:1.55;margin-top:2px}
.v__uses{font-size:11px;font-weight:600;white-space:nowrap}
.v__wave{display:flex;align-items:center;gap:2px;height:34px;overflow:hidden}
.v__wave span{width:3px;border-radius:2px}
.v__act{display:flex;gap:8px;align-items:center}
.v__play{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;flex-shrink:0}
.v__use{padding:9px 14px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap;min-height:40px}
.v__heart{display:grid;place-items:center;width:36px;height:36px;border-radius:9px}
.strip{display:flex;align-items:center;gap:14px;margin:18px;padding:15px 16px}
.strip>div{min-width:0;flex:1}
.strip b{display:flex;align-items:center;gap:7px;font-size:15px}
.strip p{font-size:11.5px;margin-top:3px}
.strip .go{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:11px;font-size:12.5px;font-weight:700;white-space:nowrap}
.disc{padding:0 18px;font-size:11px;line-height:1.75;display:flex;gap:8px}
.disc svg{margin-top:2px;flex:0 0 auto}
.foot{margin-top:auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 18px 26px;font-size:11.5px}
.foot .brand small{display:block;font-weight:500;font-size:9px;letter-spacing:1.4px;margin-top:2px}
.foot p{margin-top:8px;max-width:40ch;line-height:1.7}

/* ===================== A · PAPER STUDIO =====================
   Editorial. Cream paper, ink, one vermilion accent.
   Voice list = ledger rows with hairline rules. */
.app--A{--bg:#f6f2e9;--ink:#1d1a14;--mut:#79705f;--hair:#d9d0bd;--acc:#c24a2b;--accink:#fff;
  --card:#fffdf6;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.app--A .top{border-bottom:1px solid var(--hair)}
.app--A .brand i{background:var(--ink);color:var(--bg);border-radius:8px;font-size:14px}
.app--A .brand small{display:block;font-weight:500;color:var(--mut);font-size:9px;letter-spacing:1.4px}
.app--A .nav a{color:var(--mut)}
.app--A .nav a.on{color:var(--ink);box-shadow:inset 0 -2px var(--acc);border-radius:0}
.app--A .pill-btn{border:1px solid var(--hair);color:var(--mut)}
.app--A .eyebrow{color:var(--acc)}
.app--A .eyebrow::before{background:var(--acc)}
.app--A h1{font-family:'Noto Serif Display',var(--mm),serif;font-weight:600;letter-spacing:0}
.app--A p{color:var(--mut)}
.app--A .search{border-bottom:2px solid var(--ink);color:var(--ink)}
.app--A .search input{color:var(--ink);font-size:15px}
.app--A .search input::placeholder{color:#a99e8a}
.app--A .filters button{padding:8px 4px;color:var(--mut);border-radius:0;box-shadow:inset 0 0 var(--acc)}
.app--A .filters button.on{color:var(--ink);box-shadow:inset 0 -2px var(--acc)}
.app--A .filters button svg{opacity:.5}
.app--A .sec h2{font-family:'Noto Serif Display',var(--mm),serif;font-weight:600}
.app--A .sec p{color:var(--mut)}
.app--A .count{background:var(--card);border:1px solid var(--hair);color:var(--mut)}
.app--A .cmp-open{border:1px dashed #c4b99f;color:var(--mut);border-radius:10px;background:transparent}
.app--A .cmp-open svg{color:var(--acc)}
.app--A .vlist{grid-template-columns:1fr}
.app--A .v{padding:16px 2px;border-top:1px solid var(--hair);grid-template-areas:"ava meta uses wave act"}
.app--A .v:last-child{border-bottom:1px solid var(--hair)}
.app--A .v__idx{display:none}
.app--A .v__ava{grid-area:ava;width:56px;height:56px;background:var(--card);border:1.5px solid var(--a);color:var(--a);font-size:21px;
  font-family:'Noto Serif Display',serif}
.app--A .v__ava .ply{background:var(--a);color:#fff}
.app--A .v__meta{grid-area:meta}
.app--A .v__name{font-family:'Noto Serif Display',var(--mm),serif;font-size:19px}
.app--A .v__name svg{color:var(--a)}
.app--A .v__desc{color:var(--mut)}
.app--A .v__uses{grid-area:uses;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.app--A .v__wave{grid-area:wave;width:110px}
.app--A .v__wave span{background:var(--a);opacity:.45}
.app--A .v__act{grid-area:act}
.app--A .v__play{border:1.5px solid var(--ink);color:var(--ink)}
.app--A .v__use{border:1.5px solid var(--ink);color:var(--ink)}
.app--A .v__use.sel{background:var(--ink);color:var(--bg)}
.app--A .v__heart{color:#a99e8a}
.app--A .v__heart.on{color:#c2504a}
.app--A .strip{border:1px solid var(--hair);background:var(--card);border-radius:12px}
.app--A .strip b{font-family:'Noto Serif Display',serif;font-size:17px}
.app--A .strip b svg{color:var(--acc)}
.app--A .strip p{color:var(--mut)}
.app--A .strip .go{background:var(--acc);color:var(--accink)}
.app--A .disc{color:var(--mut)}
.app--A .disc svg{color:var(--acc)}
.app--A .foot{border-top:1px solid var(--hair);color:var(--mut)}
.app--A .foot h3{font-family:'Noto Serif Display',serif;color:var(--ink);font-size:19px;margin-top:8px}
.app--A .foot .brand i{background:var(--ink);color:var(--bg)}

/* ===================== B · NIGHT CONSOLE =====================
   Operate surface. True-neutral dark, mono labels, VU green. */
.app--B{--bg:#0e0f10;--pan:#16181a;--lin:#272a2d;--ink:#e9eaec;--mut:#8b9095;--acc:#3ddc84;
  background:var(--bg);color:var(--ink);font-family:var(--sans)}
.app--B .top{border-bottom:1px solid var(--lin);position:sticky;top:0;background:rgba(14,15,16,.92);backdrop-filter:blur(8px);z-index:5}
.app--B .brand i{background:var(--acc);color:#08130d;border-radius:7px;font-size:13px}
.app--B .brand small{display:block;font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--mut);font-size:9px;letter-spacing:1.2px}
.app--B .nav a{color:var(--mut);font-family:'JetBrains Mono',monospace;font-size:11px}
.app--B .nav a.on{color:var(--acc);background:#12241a}
.app--B .pill-btn{border:1px solid var(--lin);color:var(--mut);font-family:'JetBrains Mono',monospace;font-size:11px}
.app--B .eyebrow{color:var(--acc);font-family:'JetBrains Mono',monospace}
.app--B .eyebrow::before{background:var(--acc)}
.app--B h1{font-weight:700;letter-spacing:-.03em}
.app--B p{color:var(--mut)}
.app--B .search{background:var(--pan);border:1px solid var(--lin);border-radius:10px;padding:0 13px;color:var(--mut)}
.app--B .search input{color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:13px;padding:13px 0}
.app--B .search input::placeholder{color:#5b6165}
.app--B .filters button{padding:8px 12px;border:1px solid var(--lin);border-radius:8px;background:var(--pan);color:var(--mut);font-family:'JetBrains Mono',monospace;font-size:11px}
.app--B .filters button.on{color:var(--acc);border-color:#1f4534}
.app--B .sec h2{font-weight:700;letter-spacing:-.01em}
.app--B .sec p{color:var(--mut);font-family:'JetBrains Mono',monospace;font-size:11px}
.app--B .count{background:var(--pan);border:1px solid var(--lin);color:var(--mut);font-family:'JetBrains Mono',monospace}
.app--B .cmp-open{border:1px solid var(--lin);color:var(--mut);border-radius:10px;background:var(--pan);font-family:'JetBrains Mono',monospace;font-size:12px}
.app--B .cmp-open svg{color:var(--acc)}
.app--B .vlist{grid-template-columns:1fr;gap:8px}
.app--B .v{background:var(--pan);border:1px solid var(--lin);border-radius:10px;padding:10px 14px;grid-template-areas:"idx ava meta uses wave act"}
.app--B .v:hover{border-color:#3a3e42}
.app--B .v.sel{border-color:var(--a)}
.app--B .v__idx{grid-area:idx;font-family:'JetBrains Mono',monospace;font-size:11px;color:#565c61;width:22px}
.app--B .v__ava{grid-area:ava;width:44px;height:44px;background:color-mix(in srgb,var(--a) 15%,#101214);color:var(--a);font-size:16px;font-family:'JetBrains Mono',monospace}
.app--B .v__ava .ply{background:var(--a);color:#0a0f0c}
.app--B .v__meta{grid-area:meta}
.app--B .v__name{font-size:15px}
.app--B .v__name svg{color:var(--a)}
.app--B .v__desc{color:var(--mut);font-size:12px}
.app--B .v__uses{grid-area:uses;color:var(--mut);font-family:'JetBrains Mono',monospace;font-size:10px;border:1px solid var(--lin);padding:6px 9px;border-radius:7px}
.app--B .v__wave{grid-area:wave;width:130px}
.app--B .v__wave span{background:var(--a);opacity:.5}
.app--B .v__act{grid-area:act}
.app--B .v__play{border:1px solid var(--lin);color:var(--mut)}
.app--B .v__play:hover{color:var(--acc);border-color:#1f4534}
.app--B .v__use{border:1px solid var(--lin);color:var(--mut);font-family:'JetBrains Mono',monospace;font-size:11px}
.app--B .v__use.sel{background:#12241a;border-color:#1f4534;color:var(--acc)}
.app--B .v__heart{color:#565c61}
.app--B .v__heart.on{color:#e0547c}
.app--B .strip{border:1px solid #1f4534;background:#101a14;border-radius:10px}
.app--B .strip b svg{color:var(--acc)}
.app--B .strip p{color:var(--mut);font-family:'JetBrains Mono',monospace;font-size:10px}
.app--B .strip .go{background:var(--acc);color:#08130d;font-family:'JetBrains Mono',monospace}
.app--B .disc{color:#565c61;font-family:'JetBrains Mono',monospace;font-size:10px}
.app--B .disc svg{color:var(--acc)}
.app--B .foot{border-top:1px solid var(--lin);color:var(--mut)}
.app--B .foot h3{color:var(--ink);font-size:17px;margin-top:8px}
.app--B .foot .brand i{background:var(--acc);color:#08130d}

/* ===================== C · GALLERY =====================
   Explore as tiles. Soft gray, white cards, pastel persona fields. */
.app--C{--bg:#eceef1;--card:#ffffff;--lin:#e2e5ea;--ink:#1d2433;--mut:#6b7280;--acc:#1d2a4d;
  background:var(--bg);color:var(--ink);font-family:var(--sans)}
.app--C .top{padding:12px 18px}
.app--C .brand i{background:var(--acc);color:#fff;border-radius:9px;font-size:13px}
.app--C .brand small{display:block;font-weight:500;color:var(--mut);font-size:9px;letter-spacing:1.2px}
.app--C .nav a{color:var(--mut)}
.app--C .nav a.on{color:var(--ink);background:#dfe3e9}
.app--C .pill-btn{background:var(--card);border:1px solid var(--lin);color:var(--mut)}
.app--C .eyebrow{color:var(--acc)}
.app--C .eyebrow::before{background:var(--acc)}
.app--C h1{font-weight:800;letter-spacing:-.03em}
.app--C p{color:var(--mut)}
.app--C .search{background:var(--card);border:1px solid var(--lin);border-radius:14px;padding:0 14px;color:var(--mut)}
.app--C .search input{color:var(--ink);padding:13px 0}
.app--C .filters button{padding:9px 14px;background:var(--card);border:1px solid var(--lin);border-radius:99px;color:var(--mut)}
.app--C .filters button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.app--C .sec p{color:var(--mut)}
.app--C .count{background:var(--card);border:1px solid var(--lin);color:var(--mut)}
.app--C .cmp-open{border:1px dashed #c3c9d4;color:var(--mut);border-radius:14px;background:var(--card)}
.app--C .cmp-open svg{color:var(--acc)}
.app--C .vlist{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.app--C .v{background:var(--card);border:1px solid var(--lin);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;padding:0}
.app--C .v.sel{outline:2px solid var(--a);outline-offset:-2px}
.app--C .v__idx{display:none}
.app--C .v__ava{width:100%;height:104px;border-radius:0;background:var(--at);color:var(--ad);font-size:44px;position:relative}
.app--C .v__ava .ply{background:rgba(0,0,0,.35);color:#fff;backdrop-filter:blur(2px)}
.app--C .v__meta{padding:14px 16px 0}
.app--C .v__desc{color:var(--mut)}
.app--C .v__uses{order:4;margin:8px 16px 0;color:var(--mut);font-weight:500;white-space:normal;font-size:11.5px}
.app--C .v__wave{order:5;margin:12px 16px 0;height:30px}
.app--C .v__wave span{background:var(--ad);opacity:.55}
.app--C .v__act{order:6;padding:12px 14px 14px;margin-top:auto}
.app--C .v__play{border:1px solid var(--lin);color:var(--ink)}
.app--C .v__use{flex:1;background:var(--acc);color:#fff}
.app--C .v__use.sel{background:color-mix(in srgb,var(--ad) 18%,#fff);color:var(--ad)}
.app--C .v__heart{position:absolute;top:10px;right:10px;z-index:2;background:rgba(255,255,255,.75);backdrop-filter:blur(4px);color:#7c8390}
.app--C .v__heart.on{color:#e0547c}
.app--C .v{position:relative}
.app--C .v__heart{position:absolute}
.app--C .strip{background:var(--card);border:1px solid var(--lin);border-radius:16px}
.app--C .strip b svg{color:var(--acc)}
.app--C .strip p{color:var(--mut)}
.app--C .strip .go{background:var(--acc);color:#fff}
.app--C .disc{color:var(--mut)}
.app--C .disc svg{color:var(--acc)}
.app--C .foot{border-top:1px solid var(--lin);color:var(--mut)}
.app--C .foot h3{color:var(--ink);font-size:18px;margin-top:8px}
.app--C .foot .brand i{background:var(--acc);color:#fff}

/* ---------- responsive ---------- */
@media(min-width:760px){.nav{display:flex}}
@media(max-width:820px){
  .v{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"ava meta act" "ava uses act" "ava wave act"}
  .v__uses{white-space:normal}
  .v__wave{width:100%;min-width:60px}
}
@media(max-width:560px){
  .hero{padding:22px 16px 6px}
  .filters,.sec,.vlist,.disc{padding-left:14px;padding-right:14px}
  .cmp-open,.strip{margin-left:14px;margin-right:14px}
  .foot{padding:20px 14px 30px}
}
</style>
</head>
<body>
<div class="board">
  <div class="board-bar">
    <b>Voice Gen — directions</b><small>pick one, then it gets ported to the app</small>
    <div class="dir" role="group" aria-label="Design direction">
      <button data-d="A" class="on">A · Paper Studio</button>
      <button data-d="B">B · Night Console</button>
      <button data-d="C">C · Gallery</button>
    </div>
    <div class="loc" role="group" aria-label="Language"><button data-l="en" class="on">EN</button><button data-l="mm">MM</button></div>
  </div>
  <div class="note" id="dirnote">Direction A — editorial paper ledger. Serif headlines, hairline rows, one vermilion accent. Quietest option.</div>
  <div class="stage" id="stage"></div>
</div>

<script>
const VOICES=[
 {id:'brian',n:'Brian',a:'#2f7fd6',at:'#d7e6f7',ad:'#1e5c9e',en:'Deep, resonant and comforting',mm:'နက်ရှိုင်းပြီး နူးညံ့သောအသံ',uen:'Narration · Documentaries',umm:'ဇာတ်ကြောင်း · မှတ်တမ်းရုပ်ရှင်'},
