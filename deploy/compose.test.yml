name: voicegen-production-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicegen_test
      POSTGRES_USER: voicegen_test
      POSTGRES_PASSWORD: voicegen_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - voicegen_production_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U voicegen_test -d voicegen_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  voicegen_production_test_pgdata:
