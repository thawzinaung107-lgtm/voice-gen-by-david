name: voicegen-vps
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicegen
      POSTGRES_USER: voicegen_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - voicegen_vps_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U voicegen_owner -d voicegen"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - voicegen_vps_minio:/data
    restart: unless-stopped
volumes:
  voicegen_vps_pgdata:
  voicegen_vps_minio:
